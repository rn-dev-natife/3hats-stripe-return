<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Return to 3Hats</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      padding: 24px;
      text-align: center;
      background: #fff;
    }
    h1 { font-size: 24px; margin: 40px 0 16px; color: #111; }
    p  { color: #555; margin: 8px 0; }
    .btn {
      display: inline-block;
      margin: 16px 0;
      padding: 12px 24px;
      border-radius: 8px;
      background: #007aff;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>You're returning to 3Hats</h1>
  <p>If the app doesn’t open automatically, tap the button below.</p>
  <a class="btn" id="openBtn" href="#">Open 3Hats</a>
  <p>Or close this page and go back to the app manually.</p>

  <script>
    // Forward the `type` query param (e.g. ?type=subscription or ?type=connect)
    // so the app knows which flow to resume.
    var params = new URLSearchParams(window.location.search);
    var type = params.get('type') || 'connect';
    var deepLink = 'threehatsapp://return?fromStripe=1&type=' + encodeURIComponent(type);

    document.getElementById('openBtn').href = deepLink;

    try {
      window.location.href = deepLink;
    } catch (e) {}
  </script>
</body>
</html>
